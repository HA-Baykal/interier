# Render Blueprint — деплой в один клик (бесплатный тариф).
# Данные хранятся в файле на диске, поэтому используем постоянный диск.
services:
  - type: web
    name: interier
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/app.json
      - key: GENERATION_MODE
        value: compatible
      - key: COMPATIBLE_PROVIDER
        value: genapi
      - key: COMPATIBLE_BASE_URL
        value: https://api.gen-api.ru
      # Задайте свой ключ в панели Render (или в админке на сайте).
      - key: COMPATIBLE_API_KEY
        sync: false
      - key: COMPATIBLE_MODEL
        value: gpt-image-2
      - key: ADMIN_EMAIL
        value: admin@interier.ru
      - key: ADMIN_PASSWORD
        value: admin123
